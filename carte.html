      <h1>Carte des relais</h1>
      <p>Positions <strong>approximatives</strong> des relais du réseau Tchiniss.net. Chaque zone colorée représente une position volontairement approchée, pas l'emplacement exact de l'antenne.</p>

      <div class="filtres">
        <div class="filtre-groupe">
          <span class="filtre-titre">Statut</span>
          <div id="filtre-statuts" class="filtre-options"></div>
        </div>
        <div class="filtre-groupe">
          <span class="filtre-titre">Fréquence</span>
          <div id="filtre-frequences" class="filtre-options"></div>
        </div>
      </div>

      <div id="map"></div>

      <p>Contact : <a href="mailto:ping@lghs.be">ping@lghs.be</a></p>
